services:
  - type: web
    name: nirmal-portfolio-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://nirmalpatil132.github.io
      - key: EMAIL_PROVIDER
        value: postmark
      - key: EMAIL_TO
        value: nirmalpatil615@gmail.com
      - key: EMAIL_FROM
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
